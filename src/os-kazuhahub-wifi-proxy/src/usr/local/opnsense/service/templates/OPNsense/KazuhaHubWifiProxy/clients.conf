# Kazuha Hub Wi-Fi Proxy: the Wi-Fi access points.
# Rendered from the OPNsense configuration; manual edits are overwritten.
{% set secret_pattern = '^[A-Za-z0-9!#&()*+,./:;<=>?@^_{}|~\\[\\]-]{8,128}\\Z' %}
{% set network_pattern = '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(/([89]|[12][0-9]|3[0-2]))?\\Z' %}
{% set general = OPNsense.kazuhahubwifiproxy.general if helpers.exists('OPNsense.kazuhahubwifiproxy.general') else {} %}
{% set secret = (general.get('client_secret') or '') | string %}
{% set ns = namespace(seen=[]) %}
{% if secret is regex_match(secret_pattern) %}
{%   for network in (general.get('client_networks') or '').split(',') %}
{%     set network = network | trim %}
{%     if network is regex_match(network_pattern) %}
{#       A bare address and the same address as /32 are one network. #}
{%       set key = network[:-3] if network.endswith('/32') else network %}
{%       if key not in ns.seen %}
{%         do ns.seen.append(key) %}
client kazuhahub-ap-{{ ns.seen | length }} {
	ipv4addr = {{ key }}
	secret = "{{ secret }}"
	require_message_authenticator = auto
	limit_proxy_state = auto
}
{%       endif %}
{%     endif %}
{%   endfor %}
{% endif %}
{% if not ns.seen %}
# no-usable-client
# No usable access point secret and network: no client may talk to this server, and the
# configuration check reports it.
{% endif %}
