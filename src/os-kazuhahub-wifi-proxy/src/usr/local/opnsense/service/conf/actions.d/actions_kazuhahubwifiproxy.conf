[start]
command:/usr/local/etc/rc.d/kazuhahub_wifiproxy start
parameters:
type:script
message:starting Kazuha Hub Wi-Fi Proxy
description:Start Kazuha Hub Wi-Fi Proxy

[stop]
command:/usr/local/etc/rc.d/kazuhahub_wifiproxy onestop
parameters:
type:script
message:stopping Kazuha Hub Wi-Fi Proxy
description:Stop Kazuha Hub Wi-Fi Proxy

[restart]
command:/usr/local/etc/rc.d/kazuhahub_wifiproxy restart
parameters:
type:script
message:restarting Kazuha Hub Wi-Fi Proxy
description:Restart Kazuha Hub Wi-Fi Proxy

[reload]
command:/usr/local/etc/rc.d/kazuhahub_wifiproxy reload
parameters:
type:script
message:reloading Kazuha Hub Wi-Fi Proxy
description:Reload the Kazuha Hub Wi-Fi Proxy configuration

[status]
command:/usr/local/etc/rc.d/kazuhahub_wifiproxy onestatus
parameters:
type:script_output
message:request Kazuha Hub Wi-Fi Proxy status
errors:no

[check]
command:/bin/sh /usr/local/opnsense/scripts/kazuhahub-wifi-proxy/check.sh run
parameters:
type:script_output
message:check the Kazuha Hub Wi-Fi Proxy configuration
description:Check the Kazuha Hub Wi-Fi Proxy configuration

[lastcheck]
command:/bin/sh /usr/local/opnsense/scripts/kazuhahub-wifi-proxy/check.sh last
parameters:
type:script_output
message:read the last Kazuha Hub Wi-Fi Proxy configuration check

[homeservers]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-proxy/homeservers.php
parameters:
type:script_output
message:request the Kazuha Hub Wi-Fi Proxy central server state

[certsync]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-proxy/certsync.php run
parameters:
type:script_output
message:sync the Kazuha Hub Wi-Fi Proxy certificates from the central node
description:Sync the Kazuha Hub Wi-Fi Proxy certificates from the central node

[certsyncnow]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-proxy/certsync.php run force
parameters:
type:script_output
message:sync the Kazuha Hub Wi-Fi Proxy certificates from the central node now

[certsyncstate]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-proxy/certsync.php state
parameters:
type:script_output
message:read the Kazuha Hub Wi-Fi Proxy certificate sync state
