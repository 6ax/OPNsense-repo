# Kazuha Hub Wi-Fi Proxy: rotate the daemon log. radiusd reopens its log on SIGHUP.
# logfilename                            [owner:group]         mode count size when  flags [/pid_file] [sig_num]
/var/log/kazuhahub-wifi-proxy/radius.log     freeradius:freeradius 640  7     2048 *     JC    /var/run/kazuhahub-wifi-proxy/radiusd.pid 1
