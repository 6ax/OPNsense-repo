[start]
command:/usr/local/etc/rc.d/kazuhahub_radiusd start
parameters:
type:script
message:starting Kazuha Hub RADIUS
description:Start Kazuha Hub RADIUS

[stop]
command:/usr/local/etc/rc.d/kazuhahub_radiusd onestop
parameters:
type:script
message:stopping Kazuha Hub RADIUS
description:Stop Kazuha Hub RADIUS

[restart]
command:/usr/local/etc/rc.d/kazuhahub_radiusd restart
parameters:
type:script
message:restarting Kazuha Hub RADIUS
description:Restart Kazuha Hub RADIUS

[reload]
command:/usr/local/etc/rc.d/kazuhahub_radiusd reload
parameters:
type:script
message:reloading Kazuha Hub RADIUS
description:Reload the Kazuha Hub RADIUS configuration

[status]
command:/usr/local/etc/rc.d/kazuhahub_radiusd onestatus
parameters:
type:script_output
message:request Kazuha Hub RADIUS status
errors:no

[check]
command:/bin/sh /usr/local/opnsense/scripts/kazuhahub-radius/check.sh run
parameters:
type:script_output
message:check the Kazuha Hub RADIUS configuration
description:Check the Kazuha Hub RADIUS configuration

[lastcheck]
command:/bin/sh /usr/local/opnsense/scripts/kazuhahub-radius/check.sh last
parameters:
type:script_output
message:read the last Kazuha Hub RADIUS configuration check

[homeservers]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-radius/homeservers.php
parameters:
type:script_output
message:request the Kazuha Hub RADIUS central server state

[certsync]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-radius/certsync.php run
parameters:
type:script_output
message:sync the Kazuha Hub RADIUS certificates from the central node
description:Sync the Kazuha Hub RADIUS certificates from the central node

[certsyncnow]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-radius/certsync.php run force
parameters:
type:script_output
message:sync the Kazuha Hub RADIUS certificates from the central node now

[certsyncstate]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-radius/certsync.php state
parameters:
type:script_output
message:read the Kazuha Hub RADIUS certificate sync state
