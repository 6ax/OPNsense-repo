# Kazuha Hub RADIUS proxy: the Wi-Fi access points.
# Rendered from the OPNsense configuration; manual edits are overwritten.
{% set secret_pattern = '^[A-Za-z0-9!#&()*+,./:;<=>?@^_{}|~\\[\\]-]{8,128}\\Z' %}
{% set network_pattern = '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])(/([89]|[12][0-9]|3[0-2]))?\\Z' %}
{% set general = OPNsense.kazuhahubradius.general if helpers.exists('OPNsense.kazuhahubradius.general') else {} %}
{% set secret = general.get('client_secret', '') | string %}
{% set ns = namespace(count=0) %}
{% for network in general.get('client_networks', '').split(',') %}
{%   set network = network | trim %}
{%   if network is regex_match(network_pattern) %}
{%     set ns.count = ns.count + 1 %}
client kazuhahub-ap-{{ ns.count }} {
	ipv4addr = {{ network }}
{%     if secret is regex_match(secret_pattern) %}
	secret = "{{ secret }}"
{%     else %}
	secret = ""
{%     endif %}
	require_message_authenticator = auto
	limit_proxy_state = auto
}
{%   endif %}
{% endfor %}
{% if ns.count == 0 %}
# No access point network is configured, so no client may talk to this server.
{% endif %}
