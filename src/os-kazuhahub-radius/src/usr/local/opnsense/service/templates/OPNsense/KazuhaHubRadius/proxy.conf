# Kazuha Hub RADIUS proxy: the central servers the tunneled requests go to.
# Rendered from the OPNsense configuration; manual edits are overwritten.
{% set secret_pattern = '^[A-Za-z0-9!#&()*+,./:;<=>?@^_{}|~\\[\\]-]{8,128}\\Z' %}
{% set address_pattern = '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\\Z' %}
{% set ns = namespace(items=[]) %}
{% for central in helpers.toList('OPNsense.kazuhahubradius.general.centrals.central') %}
{%   if central.get('enabled', '0') == '1' and (central.get('address', '') | string) is regex_match(address_pattern) and (central.get('port', '') | string) is regex_match('^[0-9]{1,5}\\Z') and 1 <= (central.get('port', '0') | int) <= 65535 %}
{%     do ns.items.append(['%08d' | format(central.get('sequence', '0') | int), central]) %}
{%   endif %}
{% endfor %}
{% set ordered = ns.items | sort(attribute='0') %}

proxy server {
	default_fallback = no
}
{% for key, central in ordered %}

# Central server {{ loop.index }}
home_server central_{{ loop.index }} {
	type = auth
	ipaddr = {{ central.address }}
	port = {{ central.port | int }}
{%   set secret = central.get('secret', '') | string %}
{%   if secret is regex_match(secret_pattern) %}
	secret = "{{ secret }}"
{%   else %}
	secret = ""
{%   endif %}
	require_message_authenticator = yes
	response_window = 15
	zombie_period = 40
	status_check = status-server
	check_interval = 30
	check_timeout = 4
	num_answers_to_alive = 3
}
{% endfor %}
{% if ordered %}

home_server_pool central {
	type = fail-over
{%   for key, central in ordered %}
	home_server = central_{{ loop.index }}
{%   endfor %}
}

realm ENTRA {
	auth_pool = central
	nostrip
}
{% else %}

# No central server is enabled, so there is nothing to proxy to.
{% endif %}
