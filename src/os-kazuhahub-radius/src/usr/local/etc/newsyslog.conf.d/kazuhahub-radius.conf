# Kazuha Hub RADIUS: rotate the daemon log. radiusd reopens its log on SIGHUP.
# logfilename                            [owner:group]         mode count size when  flags [/pid_file] [sig_num]
/var/log/kazuhahub-radius/radius.log     freeradius:freeradius 640  7     2048 *     JC    /var/run/kazuhahub-radius/radiusd.pid 1
