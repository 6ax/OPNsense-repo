# Kazuha Hub Wi-Fi RADIUS: rotate the daemon log. radiusd reopens its log on SIGHUP.
# logfilename                            [owner:group]         mode count size when  flags [/pid_file] [sig_num]
/var/log/kazuhahub-wifi-radius-proxy/kazuhahub-wifi-radius-proxy_radius.log freeradius:freeradius 640  7     2048 *     JC    /var/run/kazuhahub-wifi-radius-proxy/radiusd.pid 1
# The login lines: linelog reopens its file once the rotated one is gone, so no signal.
/var/log/kazuhahub-wifi-radius-proxy/kazuhahub-wifi-radius-proxy_logins.log freeradius:freeradius 640  7     2048 *     JCN
