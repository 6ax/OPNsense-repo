[start]
command:/usr/local/etc/rc.d/kazuhahub_wifiradiusproxy start
parameters:
type:script
message:starting Kazuha Hub Wi-Fi RADIUS
description:Start Kazuha Hub Wi-Fi RADIUS

[stop]
command:/usr/local/etc/rc.d/kazuhahub_wifiradiusproxy onestop
parameters:
type:script
message:stopping Kazuha Hub Wi-Fi RADIUS
description:Stop Kazuha Hub Wi-Fi RADIUS

[restart]
command:/usr/local/etc/rc.d/kazuhahub_wifiradiusproxy restart
parameters:
type:script
message:restarting Kazuha Hub Wi-Fi RADIUS
description:Restart Kazuha Hub Wi-Fi RADIUS

[reload]
command:/usr/local/etc/rc.d/kazuhahub_wifiradiusproxy reload
parameters:
type:script
message:reloading Kazuha Hub Wi-Fi RADIUS
description:Reload the Kazuha Hub Wi-Fi RADIUS configuration

[status]
command:/usr/local/etc/rc.d/kazuhahub_wifiradiusproxy onestatus
parameters:
type:script_output
message:request Kazuha Hub Wi-Fi RADIUS status
errors:no

[check]
command:/bin/sh /usr/local/opnsense/scripts/kazuhahub-wifi-radius-proxy/check.sh run
parameters:
type:script_output
message:check the Kazuha Hub Wi-Fi RADIUS configuration
description:Check the Kazuha Hub Wi-Fi RADIUS configuration

[lastcheck]
command:/bin/sh /usr/local/opnsense/scripts/kazuhahub-wifi-radius-proxy/check.sh last
parameters:
type:script_output
message:read the last Kazuha Hub Wi-Fi RADIUS configuration check

[homeservers]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-radius-proxy/homeservers.php
parameters:
type:script_output
message:request the Kazuha Hub Wi-Fi RADIUS central server state

[certsync]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-radius-proxy/certsync.php run
parameters:
type:script_output
message:sync the Kazuha Hub Wi-Fi RADIUS certificates from the central node
description:Sync the Kazuha Hub Wi-Fi RADIUS certificates from the central node

[certsyncnow]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-radius-proxy/certsync.php run force
parameters:
type:script_output
message:sync the Kazuha Hub Wi-Fi RADIUS certificates from the central node now

[certsyncstate]
command:/usr/local/bin/php /usr/local/opnsense/scripts/kazuhahub-wifi-radius-proxy/certsync.php state
parameters:
type:script_output
message:read the Kazuha Hub Wi-Fi RADIUS certificate sync state
