# Kazuha Hub Wi-Fi RADIUS: main configuration.
# Rendered from the OPNsense configuration; manual edits are overwritten.
#
# Self-contained on purpose: nothing here reads the stock FreeRADIUS configuration
# directory, so the configuration of other software is never involved. The dictionaries
# and the module libraries are the ones compiled into the freeradius3 package.

prefix = /usr/local
exec_prefix = ${prefix}
sbindir = ${exec_prefix}/sbin
raddbdir = /usr/local/etc/kazuhahub-wifi-radius-proxy
confdir = ${raddbdir}
modconfdir = ${confdir}/mods-config
certdir = ${confdir}/certs
cadir = ${confdir}/certs
logdir = /var/log/kazuhahub-wifi-radius-proxy
run_dir = /var/run/kazuhahub-wifi-radius-proxy
db_dir = ${raddbdir}
name = radiusd
pidfile = ${run_dir}/${name}.pid

max_request_time = 30
cleanup_delay = 5
max_requests = 16384
hostname_lookups = no

log {
	destination = files
	file = ${logdir}/radius.log
	syslog_facility = daemon
	stripped_names = no
	colourise = no
	auth = yes
	# Never write passwords to the log, correct or not.
	auth_badpass = no
	auth_goodpass = no
}

checkrad = ${sbindir}/checkrad

security {
	user = freeradius
	group = freeradius
	allow_core_dumps = no
	max_attributes = 200
	reject_delay = 1
	status_server = no
	require_message_authenticator = yes
	limit_proxy_state = auto
}

proxy_requests = yes
$INCLUDE proxy.conf
$INCLUDE clients.conf

thread pool {
	start_servers = 5
	max_servers = 32
	min_spare_servers = 3
	max_spare_servers = 10
	max_requests_per_server = 0
	auto_limit_acct = no
}

modules {
	$INCLUDE mods-enabled/
}

policy {
	$INCLUDE policy.d/
}

$INCLUDE sites-enabled/
